name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PaneShift.sln
      - run: dotnet build PaneShift.sln -c Release --no-restore
      - run: dotnet test PaneShift.sln -c Release --no-build --no-restore
      - name: Validate release scripts
        run: ./scripts/Test-ReleaseScripts.ps1
      - name: Verify unsigned production publish
        run: ./scripts/Publish-Release.ps1

name: Retry release VirusTotal
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version (without v)
        required: true
        default: '0.1.0'
permissions:
  contents: read
concurrency:
  group: virustotal-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # Download draft assets and update its notes; never publish or replace assets.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download existing final assets and retry scan
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          . ./scripts/Release.Common.ps1
          $version = Get-ReleaseVersion $env:RELEASE_VERSION
          New-Item -ItemType Directory artifacts/release | Out-Null
          gh release download "v$version" --repo $env:RELEASE_REPOSITORY --dir artifacts/release --pattern "PaneShift-$version-Setup-x64.exe" --pattern "PaneShift-$version-win-x64.zip" --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download existing release assets.' }
          ./scripts/Submit-VirusTotal.ps1 -Version $version
          $json = gh release view "v$version" --repo $env:RELEASE_REPOSITORY --json body
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release notes.' }
          $body = ($json | ConvertFrom-Json).body
          $body = [regex]::Replace($body, '(?ms)^## VirusTotal\r?\n.*?(?=^## |\z)', '')
          $body.TrimEnd() + "`n" + (Get-Content artifacts/release/virustotal.md -Raw) | Set-Content artifacts/release/release-notes.md
          gh release edit "v$version" --repo $env:RELEASE_REPOSITORY --notes-file artifacts/release/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not update VirusTotal notes.' }
          Get-Content artifacts/release/virustotal.md >> $env:GITHUB_STEP_SUMMARY
